<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#246452" />
      <stop offset="100%" stop-color="#1B4D3E" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="#1B4D3E" />

  <!-- Outer subtle crest ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#2D7A63" stroke-width="4" stroke-dasharray="8 8" opacity="0.6" />

  <!-- Shield Base -->
  <path d="M 256 76 
           C 340 76, 404 116, 404 180 
           C 404 316, 320 400, 256 436 
           C 192 400, 108 316, 108 180 
           C 108 116, 172 76, 256 76 Z" 
        fill="url(#shieldGrad)" 
        stroke="#EAB308" 
        stroke-width="12" 
        filter="url(#shadow)" />

  <!-- Shield Inner Layer -->
  <path d="M 256 98 
           C 328 98, 384 132, 384 186 
           C 384 298, 312 376, 256 408 
           C 200 376, 128 298, 128 186 
           C 128 132, 184 98, 256 98 Z" 
        fill="#143C30" 
        opacity="0.9" />

  <!-- Central Emblem: Phone + Warning Strike / Shield Check -->
  <!-- Classic Handset Silhouette -->
  <g transform="translate(186, 160) scale(0.65)">
    <path d="M38.5 22.3l28.6-28.6c8.5-8.5 22.4-8.5 30.9 0l35.8 35.8c8.5 8.5 8.5 22.4 0 30.9L108 86.2c-5.2 5.2-13.4 6-19.4 2-17.5-11.7-37.4-23.7-56.6-42.9S8.1 7.2-3.6-10.3c-4-6-3.2-14.2 2-19.4L24.2-55.5c8.5-8.5 22.4-8.5 30.9 0l35.8 35.8c8.5 8.5 8.5 22.4 0 30.9L72.3 30"
          transform="translate(40, 60)"
          fill="none"
          stroke="url(#goldGrad)"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>

  <!-- Golden Checkmark and safety arc -->
  <path d="M 190 260 L 235 305 L 325 210" 
        fill="none" 
        stroke="#4ADE80" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#shadow)" />

  <!-- Radiating Safety Pulse Rings -->
  <path d="M 170 145 C 220 120, 292 120, 342 145" fill="none" stroke="#FDE047" stroke-width="8" stroke-linecap="round" opacity="0.85" />
  <path d="M 195 170 C 232 152, 280 152, 317 170" fill="none" stroke="#FDE047" stroke-width="6" stroke-linecap="round" opacity="0.6" />
</svg>
