name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".env.example", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".env.example", "LICENSE"]

# Several commits pushed in a row: only the newest one keeps running.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (rules only, no network)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest httpx  # test-only deps stay out of the image
      - run: python -m pytest tests -q
        env:
          USE_LLM: "0"
          STORE: memory
      - name: CLI smoke test
        run: python core/risk_engine.py --lang ja --no-llm --text "警察です。口座が犯罪に使われています。LINEで逮捕状を送ります"

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_BASE: same-origin

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  docker:
    name: Backend image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sagi-shield-api backend
