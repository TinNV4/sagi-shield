name: Deploy

# Automatic: every push to main that passes CI is rolled to Cloud Run (docs-only pushes skip CI, so they do not
# deploy). Tags (v1.2.3) and manual runs also work. Setup: infra/setup_cd.sh (Workload Identity Federation, no key).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ vars.GCP_PROJECT }}
  cancel-in-progress: false   # never abort a deploy half-way; the next one waits

permissions:
  contents: read
  id-token: write   # OIDC token for Workload Identity Federation

env:
  REGION: asia-northeast1
  SERVICE: sagi-shield-api
  IMAGE: asia-northeast1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/sagi/sagi-shield-api
  # the commit to deploy: the one CI just tested, or the tag / branch this run was started on
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    name: Build image and roll Cloud Run
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      # The PWA ships inside the API image (one URL, same origin) - same order as infra/deploy.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE: same-origin
          # Firebase App Check (infra/setup_appcheck.ps1 sets these public values); unset -> the PWA sends no token
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.GCP_PROJECT }}
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}
      - run: rm -rf backend/static && cp -r frontend/dist backend/static

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build -t "$IMAGE:${SHA::12}" -t "$IMAGE:latest" backend
          docker push "$IMAGE:${SHA::12}"
          docker push "$IMAGE:latest"

      - name: Deploy
        env:  # optional model overrides (repository variables); unset -> the defaults in backend/core/model_ids.py
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_VISION_MODEL: ${{ vars.GEMINI_VISION_MODEL }}
          GEMINI_LIVE_MODEL: ${{ vars.GEMINI_LIVE_MODEL }}
          GEMINI_CONFIRM_MODEL: ${{ vars.GEMINI_CONFIRM_MODEL }}
          GEMINI_DEEP_MODEL: ${{ vars.GEMINI_DEEP_MODEL }}
          STT_BATCH_MODEL: ${{ vars.STT_BATCH_MODEL }}
          APPCHECK: ${{ vars.APPCHECK }}  # off | monitor | enforce (backend/app/appcheck.py); unset -> off
          RATE_LIMIT_UNVERIFIED_PER_MIN: ${{ vars.RATE_LIMIT_UNVERIFIED_PER_MIN }}
        run: |
          # one --set-env-vars only (gcloud keeps the last); "^@^" makes @ the separator so CORS_ORIGINS may hold commas
          ENV="GOOGLE_GENAI_USE_ENTERPRISE=true@GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT }}@GOOGLE_CLOUD_LOCATION=global"
          ENV="$ENV@STORE=firestore@USE_WEBRISK=1@USE_LLM=1@CORS_ORIGINS=*"
          # models: backend/core/model_ids.py holds the defaults; a repository variable of the same name overrides one
          for job in GEMINI_MODEL GEMINI_VISION_MODEL GEMINI_LIVE_MODEL GEMINI_CONFIRM_MODEL GEMINI_DEEP_MODEL STT_BATCH_MODEL                      APPCHECK RATE_LIMIT_UNVERIFIED_PER_MIN; do
            if [ -n "${!job:-}" ]; then ENV="$ENV@$job=${!job}"; fi
          done
          # both secrets exist in this project and are read by the runtime account sagi-api, not by the deployer
          SECRETS="HASH_KEY=sagi-hash-key:latest,STT_API_KEY=sagi-stt-api-key:latest"
          gcloud run deploy "$SERVICE" --project "${{ vars.GCP_PROJECT }}" --region "$REGION" \
            --image "$IMAGE:${SHA::12}" \
            --service-account "sagi-api@${{ vars.GCP_PROJECT }}.iam.gserviceaccount.com" --allow-unauthenticated \
            --timeout 3600 --session-affinity --min-instances 0 --max-instances 3 \
            --concurrency 40 --cpu 1 --memory 1Gi --no-use-http2 \
            --set-env-vars "^@^$ENV" --set-secrets "$SECRETS" --quiet

      - name: Point the phishing-list job at the new image
        run: |
          # the monthly JPCERT/CC reload (infra/setup_phish_job.ps1) runs app/phish_list.py from the API image
          if gcloud run jobs describe sagi-phish-loader --project "${{ vars.GCP_PROJECT }}" --region "$REGION" >/dev/null 2>&1; then
            gcloud run jobs update sagi-phish-loader --project "${{ vars.GCP_PROJECT }}" --region "$REGION"               --image "$IMAGE:${SHA::12}" --quiet
          else
            echo "sagi-phish-loader not set up (infra/setup_phish_job.ps1) - skipped"
          fi

      - name: Smoke test
        run: |
          URL="$(gcloud run services describe "$SERVICE" --project "${{ vars.GCP_PROJECT }}" --region "$REGION" --format 'value(status.url)')"
          echo "Deployed: $URL"
          curl -fsS "$URL/health"
          curl -fsS -X POST "$URL/check" -H 'Content-Type: application/json' -d '{"lang":"ja","text":"こんにちは"}' >/dev/null
